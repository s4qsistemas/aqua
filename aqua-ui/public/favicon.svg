<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fondo circular azul marino profundo -->
  <circle cx="50" cy="50" r="50" fill="#0f172a" />
  
  <!-- Gota/Círculo superior celeste -->
  <circle cx="50" cy="30" r="7" fill="#38bdf8" />
  
  <!-- Ondas estilizadas de aguaSync -->
  <!-- Onda superior (Celeste) -->
  <path d="M25 48 C 35 38, 65 58, 75 48" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
  
  <!-- Onda media (Teal/Turquesa) -->
